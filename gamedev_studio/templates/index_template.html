<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{GAME_TITLE}}</title>
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 12px;
      background: var(--bg, #1a1a2e);
      color: var(--text, #fff);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      text-align: center;
      color: var(--accent, #f0a500);
    }

    #stats {
      display: flex;
      gap: 16px;
      align-items: baseline;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
    }

    #score {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent, #f0a500);
    }

    #per-sec, #click-power {
      font-size: 0.85rem;
      opacity: 0.75;
    }

    /* ── Кликабельный объект ── */
    #hero-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 16px;
    }

    #hero {
      font-size: 7rem;
      line-height: 1;
      cursor: pointer;
      transition: filter 0.1s;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    #hero:active { filter: brightness(1.3) drop-shadow(0 0 16px var(--accent, #f0a500)); }

    #hero-name {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.85;
      margin-top: 6px;
    }

    /* Анимация клика */
    @keyframes bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(0.88); }
      60%  { transform: scale(1.14); }
      100% { transform: scale(1); }
    }
    #hero.bounce { animation: bounce 0.25s ease; }

    /* Всплывающий текст при клике */
    .float-text {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      font-weight: 800;
      animation: float-up 0.9s ease forwards;
      z-index: 100;
    }

    @keyframes float-up {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
    }

    /* ── Магазин ── */
    #shop-label {
      font-size: 1rem;
      font-weight: 700;
      opacity: 0.8;
      align-self: flex-start;
      margin-bottom: 6px;
    }

    #shop {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upgrade-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--secondary, rgba(255,255,255,0.08));
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .upg-emoji { font-size: 2rem; flex-shrink: 0; }

    .upg-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .upg-info strong { font-size: 0.95rem; }
    .upg-info small  { font-size: 0.75rem; opacity: 0.65; }

    .upg-btn {
      background: var(--primary, #5a2d82);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }

    .upg-btn:not(:disabled):hover  { background: var(--accent, #f0a500); }
    .upg-btn:not(:disabled):active { transform: scale(0.95); }
    .upg-btn:disabled               { cursor: not-allowed; }

    /* ── Кнопка рекламы ── */
    #ad-btn {
      margin-top: 14px;
      background: transparent;
      border: 2px solid var(--accent, #f0a500);
      color: var(--accent, #f0a500);
      border-radius: 10px;
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #ad-btn:hover { background: var(--accent, #f0a500); color: #000; }
  </style>
</head>
<body>
  <div id="game-title">{{GAME_TITLE}}</div>

  <div id="stats">
    <span id="score">0</span>
    <span id="per-sec"></span>
    <span id="click-power"></span>
  </div>

  <div id="hero-area">
    <div id="hero" role="button" aria-label="Кликни!">❓</div>
    <div id="hero-name"></div>
  </div>

  <div id="shop-label">🏪 Магазин улучшений</div>
  <div id="shop"></div>

  <button id="ad-btn">📺 Смотреть рекламу → +100 бонус</button>

  <script src="game.js"></script>
</body>
</html>
