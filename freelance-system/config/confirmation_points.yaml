# Пороги уверенности и правила эскалации для 3 точек подтверждения.
# Механизм самоулучшения #4 из docs/IMPROVEMENT_LOOP.md: пороги должны
# пересматриваться на основе накопленной статистики в outcomes,
# а не устанавливаться один раз и забываться.

confirmation_points:

  # Точка #1 — отправка заявки. Ставки низкие, можно доверять больше.
  proposal:
    auto_send_min_confidence: 0.85   # выше — авто-отправка, ниже — на подтверждение
    always_confirm: false
    # Дополнительная эскалация: если вакансия нетипична (мало похожих
    # примеров в Graphiti), понижаем эффективный порог принудительно
    escalate_if_novel_category: true
    novel_category_min_examples: 3   # меньше 3 похожих примеров = нетипично

  # Точка #2 — план и оценка после победы. Ставки выше.
  plan:
    always_confirm: true             # НЕ меняй на false без веской причины —
                                      # неверная оценка объёма стоит дороже,
                                      # чем непринятая заявка

  # Точка #3 — финальная сдача клиенту. Самая важная точка.
  delivery:
    always_confirm: true             # никогда не автоматизировать полностью

# Пересмотр порогов: раз в 2-4 недели вместе с weekly_review.py.
# Понижай auto_send_min_confidence для proposal ТОЛЬКО если outcomes
# за период показывают стабильно хороший конверт на авто-отправленных
# заявках — не по интуиции.
review_cadence_days: 21
